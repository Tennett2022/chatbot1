version: "3.9"

services:
  # ─────────────────────────────────────────────
  # Crovenett Chatbot API
  # ─────────────────────────────────────────────
  chatbot:
    build:
      context: .
      target: production
    container_name: crovenett-chatbot
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/crovenett_chatbot.db
    volumes:
      - chatbot_data:/app/data
    networks:
      - chatbot_network
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────────
  # Optional: PostgreSQL (uncomment for production)
  # ─────────────────────────────────────────────
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: crovenett-postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: crovenett
  #     POSTGRES_PASSWORD: changeme
  #     POSTGRES_DB: crovenett_chatbot
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - chatbot_network
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U crovenett"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # ─────────────────────────────────────────────
  # Optional: ngrok for local webhook testing
  # ─────────────────────────────────────────────
  # ngrok:
  #   image: ngrok/ngrok:latest
  #   container_name: crovenett-ngrok
  #   restart: unless-stopped
  #   command: http chatbot:8000
  #   environment:
  #     - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
  #   ports:
  #     - "4040:4040"
  #   networks:
  #     - chatbot_network
  #   depends_on:
  #     - chatbot

volumes:
  chatbot_data:
    driver: local
  # postgres_data:
  #   driver: local

networks:
  chatbot_network:
    driver: bridge
